# The theme is the one every Snail site wears, carried by Snail.Sdk: the SnailSite target lays it over this file.
site_name: Snail.Toolkit.Web
site_description: Questions about the web, answered separately, on one shared foundation.
site_url: https://orldev.github.io/Snail.Toolkit.Web/
repo_url: https://github.com/orldev/Snail.Toolkit.Web
copyright: MIT

# Everything the site is made of sits beside this file: content/ is the prose and generator/ the tool that
# writes the generated half. Both paths below are read relative to THIS file, so
# the pipeline moves as one folder and none of them names the repository root.
docs_dir: content
site_dir: site

# The nav is written by hand while the pages under reference/ and decisions/ are generated, and that is the
# guard rather than an oversight: --strict fails on a page missing from the nav and on a nav entry missing its
# page, so a package added without touching this file stops the build in both directions.
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Principles: principles.md
  - Reference:
      - All packages: reference/index.md
      - Snail.Toolkit.Web: reference/web.md
      - Snail.Toolkit.Web.Search: reference/search.md
      - Snail.Toolkit.Web.Scraping: reference/scraping.md
      - Snail.Toolkit.Web.Search.Browser: reference/search-browser.md
      - Snail.Toolkit.Web.Search.Browser.Agent: reference/search-browser-agent.md
      - Snail.Toolkit.Web.Scraping.Agent: reference/scraping-agent.md
  - Decisions:
      - All packages: decisions/index.md
      - Snail.Toolkit.Web: decisions/web.md
      - Snail.Toolkit.Web.Search: decisions/search.md
      - Snail.Toolkit.Web.Scraping: decisions/scraping.md
      - Snail.Toolkit.Web.Search.Browser: decisions/search-browser.md
      - Snail.Toolkit.Web.Search.Browser.Agent: decisions/search-browser-agent.md
      - Snail.Toolkit.Web.Scraping.Agent: decisions/scraping-agent.md

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.superfences

plugins:
  - search

strict: true
