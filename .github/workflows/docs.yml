name: documentation

# The API reference and the MkDocs site in docs/ on GitHub Pages, from every push to the default branch. The site's
# own reference and decisions are generated by docs/generator; the check fails when they no longer match the code.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: orldev/Snail.Sdk/.github/workflows/docs.yml@v1
    with:
      prepare: dotnet run --project docs/generator --configuration Release --no-build -- check
