# The browser-backed tests, against the patched browser here and against the stock one locally. Everything else —
# the other tests, the reference, the package — is ci.yml, the shared CI of Snail.Sdk, which has no browser image
# and leaves these classes out.
#
# The runner is amd64, which is the architecture the patched image is built for, so it costs nothing extra --
# measured on an arm64 laptop the same suite takes 1m43s under emulation against 12s on the stock image. That
# difference is emulation, not the engine, and it does not exist here.
name: browser integration

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # The patched build: reports navigator.webdriver === false natively, with no trace of a substitution.
      # The tag names the browser version, the Playwright version and the architecture, and all three have to
      # match what this project references -- a server answers a client of another version with 428 and nothing
      # else. BrowserImage refuses a mismatched tag before anything starts.
      #
      # 155.0 STOOD HERE UNTIL 2026-09-20 AND WOULD HAVE KILLED THIS JOB. That image carried a juggler taken
      # from Playwright's main -- a 1.63-era protocol -- while the client here is 1.62, and the pair does not
      # fail at the handshake: it reads simple pages and dies on a heavy one, which is the worst way for a
      # build to be wrong. The 428 guard never saw it, because 428 compares the CLIENT with the SERVER and
      # both of those said 1.62. Nothing caught it here because this repository has no remote yet and these
      # workflows have never run. The tag below is built from the v1.62.0 tag end to end.
      SNAIL_BROWSER_IMAGE: ghcr.io/orldev/ff-juggler:153.0-pw1.62-amd64
      SNAIL_BROWSER_ENGINE: Firefox

    steps:
      - uses: actions/checkout@v7

      # Read from global.json rather than written here: the .editorconfig rules this build fails over are
      # analyzers that ship with the SDK, so the version is part of what the build MEANS and belongs in one
      # place. 'dotnet-version: 10.0.x' would install whatever is newest and quietly judge the code by
      # another band's rules.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The image is public since 2026-10-27, so a pull needs no sign-in. The step stays for a private image
      # named here: GITHUB_TOKEN reaches one only once the package grants this repository read access.
      - name: Sign in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build --configuration Release -warnaserror

      # Every class marked Integration, less the Live ones, which ask a third party and need a browser server named
      # in their own variable. The mirror of ci.yml's filter, by the same trait rather than by a list of names.
      - name: Test
        run: >-
          dotnet test --configuration Release --no-build --logger "console;verbosity=normal"
          --filter "Category=Integration&Category!=Live"
