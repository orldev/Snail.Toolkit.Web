name: performance

# Every two months: the benchmarks against benchmarks/Web.Benchmarks/baseline/, and Stryker.NET on the tests.

on:
  schedule:
    - cron: '0 4 1 */2 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    uses: orldev/Snail.Sdk/.github/workflows/perf.yml@v1
    with:
      benchmarks: benchmarks/Web.Benchmarks
