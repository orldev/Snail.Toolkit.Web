name: performance

# Twice a year, on the first of January and of July: the benchmarks against benchmarks/Web.Benchmarks/baseline/,
# and Stryker.NET on the tests.
# Run it by hand after a change on a hot path; the baseline comes from the same kind of runner.

on:
  schedule:
    - cron: '0 4 1 1,7 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    uses: orldev/Snail.Sdk/.github/workflows/perf.yml@v1
    with:
      benchmarks: benchmarks/Web.Benchmarks
